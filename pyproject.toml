[project]
name = "smart-docs"
version = "0.1.0"
description = "Open-source knowledge base where people and AI agents are equal users."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "procrastinate>=3.0",
    "openai>=1.50",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=43",
    "markdown-it-py>=3.0",
    "nh3>=0.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "mcp>=1.10",
]

[project.scripts]
sd = "smart_docs.cli:main"
sd-mcp = "smart_docs.mcp.stdio:main"
sd-evals = "evals.run:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_docs", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

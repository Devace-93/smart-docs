name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Long enough to wait for the box-wide deploy lock below.
          command_timeout: 60m
          script: |
            set -euo pipefail
            # One deploy at a time on the box. Every app shares this lock, so
            # simultaneous pushes to several repos queue up instead of building
            # together and exhausting the memory (2026-11-18).
            exec 9>/var/lock/box-deploy.lock
            flock -w 2400 9
            cd /opt/smart-docs
            git pull --ff-only
            docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --profile local up -d --build --remove-orphans
            docker image prune -f
